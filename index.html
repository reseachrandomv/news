<!doctype html><html lang="en"><head><meta charset="utf-8"><script>{const q=new URLSearchParams(location.search).get("theme");if(q)localStorage.theme=q}if(localStorage.theme=="light")document.documentElement.dataset.theme="light"</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>News – Made by Fathimath Malaak Jaufar</title>
<style>
:root{--fs:19px;--bg:#0b1a33;--card:#132a4d;--ink:#eef4ff;--muted:#b7c8e3;--blue:#8cc4ff;--blue2:#1f3f6e;--head:#06122a;--btnbg:#132a4d;--on:#06122a;color-scheme:dark}
:root[data-theme=light]{--bg:#eef4fb;--card:#fff;--ink:#0b2340;--muted:#3a5470;--blue:#0b4f9c;--blue2:#e1ecf8;--head:#0b4f9c;--btnbg:#fff;--on:#fff;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--head);color:#fff;padding:18px 16px}header .w{max-width:1000px;margin:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.6em}.sub{font-size:.85em;opacity:.95}
button{font:inherit;cursor:pointer;border-radius:999px;border:2px solid var(--blue);min-height:44px;padding:6px 16px;background:var(--btnbg);color:var(--blue);font-weight:600}
button:focus-visible,a:focus-visible{outline:3px solid #f5b400;outline-offset:2px}
header button{border-color:#fff;background:transparent;color:#fff}.tools{display:flex;gap:8px;flex-wrap:wrap}footer a{color:var(--blue);font-weight:700}
nav{max-width:1000px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
nav button{white-space:nowrap}nav button[aria-pressed=true]{background:var(--blue);color:var(--on)}
main{max-width:1000px;margin:auto;padding:12px 16px 30px;display:grid;gap:14px}
.meta{color:var(--muted);font-size:.85em}
article{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px #0006;border-left:5px solid var(--blue)}
article h2{font-size:1.15em;margin:4px 0 6px;line-height:1.35}article h2 a{color:var(--ink);text-decoration:none}article h2 a:hover{text-decoration:underline}
article p{margin:0 0 8px}.src{display:inline-block;background:var(--blue2);color:var(--blue);font-weight:700;border-radius:6px;padding:0 8px;font-size:.8em}
.read{color:var(--blue);font-weight:700}
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:.9em}
</style></head><body>
<header><div class="w"><div><h1>News</h1><div class="sub">Made by Fathimath Malaak Jaufar</div></div>
<div class="tools"><button id="ts" aria-label="Change text size">Text size: A</button><button id="tm" aria-pressed="false">Light mode</button></div></div></header>
<nav id="countries" aria-label="Choose country"></nav>
<main id="list" aria-live="polite"><p>Loading headlines…</p></main>
<footer><strong>Made by Fathimath Malaak Jaufar</strong><br>Contact: WhatsApp <a href="https://wa.me/9609424572" rel="noopener">+960 9424572</a> · Email <a href="mailto:malaak.office@gmail.com">malaak.office@gmail.com</a><br> Headlines, summaries and links come from each outlet's public RSS feed; full stories belong to the named source. <span id="upd"></span></footer>
<script>
const tm=document.getElementById('tm');function applyTheme(t){if(t=='light')document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;tm.textContent=t=='light'?'Dark mode':'Light mode';tm.setAttribute('aria-label','Switch to '+(t=='light'?'dark':'light')+' mode')}
let theme=localStorage.theme||'dark';applyTheme(theme);tm.onclick=()=>{theme=theme=='light'?'dark':'light';localStorage.theme=theme;applyTheme(theme)};
const ORDER=["Maldives","Courses","Tech","Population","World","UK","USA","India","Sri Lanka","Pakistan","UAE","Australia"];
const LABEL={Courses:"Courses & Announcements",Tech:"Tech & Gadgets",Population:"World Population"};let pop=null,timer=null;
const sizes=[19,22,26],labels=["A","A+","A++"];let si=+(localStorage.ts||0);
const ts=document.getElementById('ts');function applySize(){document.documentElement.style.setProperty('--fs',sizes[si]+'px');ts.textContent='Text size: '+labels[si]}
ts.onclick=()=>{si=(si+1)%3;localStorage.ts=si;applySize()};applySize();
let data,cur=new URLSearchParams(location.search).get("tab")||localStorage.country||"Maldives";
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=d=>{if(!d)return"";const m=(Date.now()-new Date(d))/6e4;return m<60?Math.max(1,m|0)+" min ago":m<1440?(m/60|0)+" h ago":new Date(d).toLocaleDateString()};
function render(){
 const nav=document.getElementById('countries');const cs=ORDER.filter(c=>c=="Population"?pop:data.items.some(i=>i.country==c));
 if(!cs.includes(cur))cur="Maldives";
 nav.innerHTML=cs.map(c=>`<button aria-pressed="${c==cur}" data-c="${c}">${LABEL[c]||c}</button>`).join('');
 nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.c;localStorage.country=cur;render();scrollTo(0,0)});
 clearInterval(timer);if(cur=="Population")return renderPop();
 const items=data.items.filter(i=>i.country==cur);
 document.getElementById('list').innerHTML=`<h2 style="margin:4px 0">${esc(LABEL[cur]||cur+" news")}</h2>`+items.map(i=>`<article><span class="src">${esc(i.source)}</span> <span class="meta">${esc(i.category)} · ${ago(i.published)}</span>
 <h2><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a></h2>${i.summary?`<p>${esc(i.summary)}</p>`:''}
 <a class="read" href="${esc(i.link)}" target="_blank" rel="noopener">Read at ${esc(i.source)} →</a></article>`).join('');
}
const nf=n=>Math.round(n).toLocaleString('en-US');
function renderPop(){const w=pop.world,b=w.pop.value,y0=Date.UTC(w.pop.year,6,1),yr=365.25*864e5,g=Math.log(1+w.growth.value/100);
 const now=new Date(),ys=Date.UTC(now.getUTCFullYear(),0,1);
 const cards=[["World population (live estimate)","pop"],["Births this year (estimate)","b"],["Deaths this year (estimate)","d"],["Population growth this year (estimate)","n"]];
 const src=`Source: <a href="${pop.source_url}" target="_blank" rel="noopener">${esc(pop.source)}</a>`;
 document.getElementById('list').innerHTML=`<h2 style="margin:4px 0">World Population</h2><p class="meta">These are <strong>estimates</strong>, not exact counts. They start from the World Bank's ${w.pop.year} figure (${nf(b)}) and add the ${w.growth.year} growth rate (${w.growth.value.toFixed(2)}% a year), birth rate (${w.birth_rate.value.toFixed(1)} per 1,000) and death rate (${w.death_rate.value.toFixed(1)} per 1,000). ${src}</p>`+
 cards.map(([t,k])=>`<article><span class="meta">${t}</span><h2 id="pc-${k}" style="font-size:1.8em;margin:4px 0">…</h2></article>`).join('')+
 `<article><span class="meta">Maldives population (World Bank, ${pop.maldives.pop.year})</span><h2 style="font-size:1.6em;margin:4px 0">${nf(pop.maldives.pop.value)}</h2><p>Growth ${pop.maldives.growth.value.toFixed(2)}% a year (${pop.maldives.growth.year}). ${src}</p></article>`+
 `<article><span class="meta">Other facts (World Bank, ${w.life_exp.year})</span><p>Life expectancy worldwide: <strong>${w.life_exp.value.toFixed(1)} years</strong><br>People living in cities: <strong>${w.urban_pct.value.toFixed(1)}%</strong></p><p class="meta">${src}</p></article>`+
 `<article><span class="meta">Most populated countries (World Bank, ${pop.top[0].year})</span><ol>${pop.top.map(t=>`<li>${esc(t.name)}: <strong>${nf(t.pop)}</strong></li>`).join('')}</ol><p class="meta">${src}</p></article>`;
 const tick=()=>{const t=Date.now(),P=b*Math.exp(g*(t-y0)/yr),Ps=b*Math.exp(g*(ys-y0)/yr),f=(t-ys)/yr;
  const B=P*w.birth_rate.value/1000*f,D=P*w.death_rate.value/1000*f;
  for(const[k,v]of[["pop",P],["b",B],["d",D],["n",P-Ps]]){const e=document.getElementById('pc-'+k);if(e)e.textContent=nf(v)}};
 tick();timer=setInterval(tick,1000);}
fetch('data/population.json?'+Date.now()).then(r=>r.json()).then(p=>{pop=p;if(data)render()}).catch(()=>{});
fetch('data/news.json?'+Date.now()).then(r=>r.json()).then(d=>{data=d;document.getElementById('upd').textContent='Updated '+new Date(d.updated).toLocaleString()+'. Refreshes every hour.';render()})
.catch(()=>document.getElementById('list').innerHTML='<p>Could not load news. Please try again.</p>');
</script></body></html>
