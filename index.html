<!doctype html><html lang="en"><head><meta charset="utf-8"><script>if(+localStorage.fontScale)document.documentElement.style.setProperty("--scale",localStorage.fontScale);{const q=new URLSearchParams(location.search).get("theme");if(q)localStorage.theme=q}if(localStorage.theme!="dark")document.documentElement.dataset.theme="light"</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raajjé Digest – Made by Fathimath Malaak Jaufar</title>
<script>if(!localStorage.introSeen&&!/[?&]tab=/.test(location.search))location.replace("about.html")</script><script src="i18n.js"></script>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml"><meta property="og:title" content="Raajjé Digest"><meta property="og:description" content="Maldives local news plus world, tech, science, courses and announcements, updated every 30 minutes. Made by Fathimath Malaak Jaufar."><meta property="og:image" content="https://reseachrandomv.github.io/news/og.png"><meta name="twitter:card" content="summary_large_image">

<link rel="preload" href="fonts/Faruma.woff2" as="font" type="font/woff2" crossorigin>
<style>html{background:#1b1613}html[data-theme=light]{background:#f6ebde}</style>
<link rel="stylesheet" href="styles.css"></head><body class="home">
<header><div class="w"><div class="brand"><img src="logo-mark.svg" alt=""><div><h1 data-t="site">Raajjé Digest</h1><div class="sub" data-t="madeBy"></div><div class="sub" id="today"></div></div></div>
<div class="tools"><a class="ab" href="about.html" data-t="about"></a><button id="lg" lang="en"></button><div class="fsz" role="group" id="fsg" dir="ltr"><button id="fsm">A−</button><button id="fsr">A</button><button id="fsp">A+</button></div><button id="tm"></button></div></div></header>
<nav id="countries"></nav>
<main id="list" aria-live="polite"><p class="vh" data-t="loading"></p><article class="sk" aria-hidden="true"><i class="im"></i><i class="s"></i><i class="l"></i><i class="m"></i></article><article class="sk" aria-hidden="true"><i class="im"></i><i class="s"></i><i class="l"></i><i class="m"></i></article><article class="sk" aria-hidden="true"><i class="im"></i><i class="s"></i><i class="l"></i><i class="m"></i></article></main>
<footer><strong data-t="madeBy"></strong><br><span data-t="contact"></span> WhatsApp <a href="https://wa.me/9609424572" rel="noopener" dir="ltr">+960 9424572</a> · <span data-t="email"></span> <a href="mailto:malaak.office@gmail.com">malaak.office@gmail.com</a><br><span data-t="srcNote"></span> <span id="upd"></span></footer>
<script>
const $=id=>document.getElementById(id);
function staticText(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.title=t('site');
 $('countries').setAttribute('aria-label',t('chooseTab'));$('fsg').setAttribute('aria-label',t('textSize'));$('fsm').setAttribute('aria-label',t('smaller'));$('fsp').setAttribute('aria-label',t('larger'));
 const o=Object.keys(LANGS).find(l=>l!=LANG);$('lg').textContent=LANGS[o].label;$('lg').lang=o;$('lg').setAttribute('aria-label',t('langAria'))}
const tm=$('tm');function applyTheme(x){if(x=='light')document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;tm.textContent=x=='light'?t('dark'):t('light');tm.setAttribute('aria-label',x=='light'?t('toDark'):t('toLight'));if(window.renderDock)renderDock()}
let theme=localStorage.theme||'light';tm.onclick=()=>{theme=theme=='light'?'dark':'light';localStorage.theme=theme;applyTheme(theme)};
const ORDER=["Maldives","Courses","Tech","Science","Population","World","UK","USA","India","Sri Lanka","Pakistan","UAE","Australia"];let pop=null,timer=null;
const STEPS=[.85,1,1.15,1.3,1.4];let si=STEPS.indexOf(+localStorage.fontScale);if(si<0)si=1;
const fsm=$('fsm'),fsr=$('fsr'),fsp=$('fsp');
function applySize(){const v=STEPS[si];document.documentElement.style.setProperty('--scale',v);localStorage.fontScale=v;fsm.disabled=si==0;fsp.disabled=si==STEPS.length-1;fsr.setAttribute('aria-pressed',si==1);fsr.setAttribute('aria-label',t('reset',{p:Math.round(v*100)}))}
fsm.onclick=()=>{if(si>0)si--;applySize()};fsp.onclick=()=>{if(si<STEPS.length-1)si++;applySize()};fsr.onclick=()=>{si=1;applySize()};
let data,cur=new URLSearchParams(location.search).get("tab")||localStorage.country||"Maldives",mvF=localStorage.mvF||(localStorage.dvOnly=="1"?"dv":"all");
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const THAANA=/[\u0780-\u07BF]/,isDv=i=>THAANA.test(i.title);
const loc=()=>LANG=='dv'?'dv-MV':'en-GB';
const ago=d=>{if(!d)return"";const m=(Date.now()-new Date(d))/6e4;return m<60?t('minAgo',{n:Math.max(1,m|0)}):m<1440?t('hAgo',{n:m/60|0}):new Date(d).toLocaleDateString(loc())};
const tab=c=>STR[LANG].tabs[c]||STR.en.tabs[c]||c,cat=c=>STR[LANG].cats[c]||c;
function applyAll(){$('today').textContent=new Date().toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric'});setLangAttrs();staticText();applyTheme(theme);applySize();if(data){$('upd').textContent=t('updated',{t:new Date(data.updated).toLocaleString(loc())});render()}}
$('lg').onclick=()=>{LANG=$('lg').lang;localStorage.lang=LANG;applyAll()};
function render(){
 const nav=$('countries');const cs=ORDER.filter(c=>c=="Population"?pop:data.items.some(i=>i.country==c));
 if(!cs.includes(cur))cur="Maldives";
 nav.innerHTML=cs.map(c=>`<button aria-pressed="${c==cur}" data-c="${c}">${esc(tab(c))}</button>`).join('');
 nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.c;localStorage.country=cur;render();scrollTo(0,0)});
 clearInterval(timer);if(cur=="Population"){try{return renderPop()}catch(e){console.error(e);pop=POP_FB;return renderPop()}}
 let items=data.items.filter(i=>i.country==cur);if(cur=="Science")items=[...items.filter(i=>i.category=="UK"),...items.filter(i=>i.category!="UK")];
 const hasDv=items.some(isDv);
 if(hasDv&&mvF=='dv')items=items.filter(isDv);else if(hasDv&&mvF=='en')items=items.filter(i=>!isDv(i));else if(LANG=='dv')items=[...items.filter(isDv),...items.filter(i=>!isDv(i))];
 const filt=hasDv?`<div class="filt" role="group" aria-label="${esc(t('filter'))}"><span class="meta">${esc(t('filter'))}:</span><button data-f="all" aria-pressed="${mvF=='all'}">${esc(t('fAll'))}</button><button data-f="dv" aria-pressed="${mvF=='dv'}">${esc(t('fDv'))}</button><button data-f="en" aria-pressed="${mvF=='en'}">${esc(t('fEn'))}</button></div>`:'';
 const head=STR[LANG].tabs[cur]&&["Maldives","World","UK","USA","India","Sri Lanka","Pakistan","UAE","Australia"].includes(cur)?t('tabNews',{c:tab(cur)}):tab(cur);
 $('list').innerHTML=`<h2>${esc(head)}</h2>${filt}`+(items.length?layout(items,(i,k)=>`<article class="${k||''}">${/^https:/.test(i.image||"")?`<a class="thumb" href="${esc(i.link)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="${esc(i.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>`:""}<div class="row"><span class="src" dir="auto">${esc(i.source)}</span><span class="meta">${esc(cat(i.category))} · ${ago(i.published)}</span></div>
 ${(()=>{const tr=LANG=='dv'&&i.title_dv;const T=tr?i.title_dv:i.title,S=tr?(i.summary_dv||i.summary):i.summary;return `${tr?`<button class="trp" data-o="${esc(i.title)}" data-os="${esc(i.summary||'')}" aria-label="${esc(t('showOrig'))}">${esc(t('translated'))} · ${esc(t('showOrig'))}</button>`:''}<h2 dir="auto"><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(T)}</a></h2>${S?`<p dir="auto">${esc(S)}</p>`:''}`})()}
 <a class="read" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(t('readAt',{s:i.source}))}</a></article>`):`<p>${esc(t('empty'))}</p>`);reveal();
 function pulse(el){if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap')}
$('list').querySelectorAll('.trp').forEach(b=>b.onclick=()=>{const a=b.closest('article'),h=a.querySelector('h2 a'),p=a.querySelector('p');pulse(a);if(!b.dataset.d){b.dataset.d=h.textContent;b.dataset.ds=p?p.textContent:'';h.textContent=b.dataset.o;h.parentNode.dir='ltr';if(p){p.textContent=b.dataset.os;p.dir='ltr'}b.textContent=t('showDv')}else{h.textContent=b.dataset.d;h.parentNode.dir='auto';if(p){p.textContent=b.dataset.ds;p.dir='auto'}delete b.dataset.d;b.textContent=t('translated')+' · '+t('showOrig')}});
 $('list').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{mvF=b.dataset.f;localStorage.mvF=mvF;render()});
 if(window.renderDock)renderDock();
}
function layout(it,f){if(it.length<4)return it.map(i=>f(i)).join('');const dv=LANG=='dv';
 const top=it.slice(1,9),rest=it.slice(9);
 return f(it[0],'hero')+`<section class="tops"><h3>${dv?'މުހިންމު ޚަބަރުތައް':'Top stories'}</h3><div class="trow">${top.map(i=>f(i,'mini')).join('')}</div></section>`+(rest.length?`<h3 class="more">${dv?'އިތުރު ޚަބަރުތައް':'More stories'}</h3>`+rest.map(i=>f(i)).join(''):'')}
function reveal(){const els=[...document.querySelectorAll('#list article:not(.hero)')];if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const io=new IntersectionObserver(es=>{let n=0;es.forEach(e=>{if(e.isIntersecting){e.target.style.transitionDelay=(n++%6)*60+'ms';e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -5% 0px'});
 els.forEach(e=>{e.classList.add('rv');io.observe(e)})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!matchMedia('(prefers-reduced-motion: reduce)').matches){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}});
const POP_FB={source:"World Bank Open Data (UN World Population Prospects) - built-in estimate",source_url:"https://data.worldbank.org/indicator/SP.POP.TOTL",world:{pop:{value:8215424893,year:2025},growth:{value:0.91,year:2025},birth_rate:{value:16.3,year:2024},death_rate:{value:7.6,year:2024},life_exp:{value:73.5,year:2024},urban_pct:{value:57.8,year:2024}},maldives:{pop:{value:529676,year:2025},growth:{value:0.35,year:2025}},top:[["India", 1463865525], ["China", 1406585000], ["United States", 341784857], ["Indonesia", 285721236], ["Pakistan", 255219554], ["Nigeria", 237527782], ["Brazil", 212812405], ["Bangladesh", 175686899], ["Russian Federation", 143513328], ["Ethiopia", 135472051]].map(([name,pop])=>({name,pop,year:2025}))};
function fixPop(p){p=p||{};const w=Object.assign({},POP_FB.world,p.world||{}),r={...POP_FB,...p,world:w};
 for(const k in POP_FB.world)if(!w[k]||typeof w[k].value!="number")w[k]=POP_FB.world[k];
 if(!r.maldives||!r.maldives.pop||!r.maldives.growth)r.maldives=POP_FB.maldives;
 if(!Array.isArray(r.top)||r.top.length<5)r.top=POP_FB.top;return r}
pop=POP_FB;
const nf=n=>Math.round(n).toLocaleString('en-US');
function renderPop(){const w=pop.world,b=w.pop.value,y0=Date.UTC(w.pop.year,6,1),yr=365.25*864e5,g=Math.log(1+w.growth.value/100);
 const now=new Date(),ys=Date.UTC(now.getUTCFullYear(),0,1);
 const cards=[["popLive","pop"],["popBirths","b"],["popDeaths","d"],["popGrowth","n"]];
 const src=`${esc(t('source'))} <a href="${pop.source_url}" target="_blank" rel="noopener">${esc(pop.source)}</a>`;
 $('list').innerHTML=`<h2 style="margin:4px 0">${esc(t('popTitle'))}</h2><p class="meta">${t('popNote',{y:w.pop.year,b:nf(b),gy:w.growth.year,g:w.growth.value.toFixed(2),br:w.birth_rate.value.toFixed(1),dr:w.death_rate.value.toFixed(1)})} ${src}</p>`+
 cards.map(([k1,k])=>`<article><span class="meta">${esc(t(k1))}</span><h2 id="pc-${k}" dir="ltr" style="font-size:1.8em;margin:4px 0;text-align:start">…</h2></article>`).join('')+
 `<article><span class="meta">${esc(t('mvPop',{y:pop.maldives.pop.year}))}</span><h2 style="font-size:1.6em;margin:4px 0">${nf(pop.maldives.pop.value)}</h2><p>${esc(t('mvGrowth',{g:pop.maldives.growth.value.toFixed(2),y:pop.maldives.growth.year}))} ${src}</p></article>`+
 `<article><span class="meta">${esc(t('other',{y:w.life_exp.year}))}</span><p>${esc(t('life'))} <strong>${w.life_exp.value.toFixed(1)} ${esc(t('years'))}</strong><br>${esc(t('urban'))} <strong>${w.urban_pct.value.toFixed(1)}%</strong></p><p class="meta">${src}</p></article>`+
 `<article><span class="meta">${esc(t('top',{y:pop.top[0].year}))}</span><ol>${pop.top.map(x=>`<li>${esc(x.name)}: <strong>${nf(x.pop)}</strong></li>`).join('')}</ol><p class="meta">${src}</p></article>`;
 const tick=()=>{const T=Date.now(),P=b*Math.exp(g*(T-y0)/yr),Ps=b*Math.exp(g*(ys-y0)/yr),f=(T-ys)/yr;
  const B=P*w.birth_rate.value/1000*f,D=P*w.death_rate.value/1000*f;
  for(const[k,v]of[["pop",P],["b",B],["d",D],["n",P-Ps]]){const e=$('pc-'+k);if(e)e.textContent=nf(v)}};
 tick();timer=setInterval(tick,1000);if(window.renderDock)renderDock()}
applyAll();
fetch('data/population.json?'+Date.now()).then(r=>r.json()).then(p=>{pop=fixPop(p);if(data)render()}).catch(()=>{});
fetch('data/news.json?'+Date.now()).then(r=>r.json()).then(d=>{data=d;applyAll()})
.catch(()=>$('list').innerHTML=`<p>${esc(t('loadFail'))}</p>`);
</script><script src="dock.js"></script></body></html>
