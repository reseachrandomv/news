function clipWords(str,n){
  const s=(str||'').replace(/\s+/g,' ').trim();
  if(s.length<=n) return s;
  const cut=s.slice(0,n);
  const sp=cut.lastIndexOf(' ');
  return (sp>24?cut.slice(0,sp):cut).replace(/[\s.,;:–—-]+$/,'')+'…';
}
function hires(url,w){
  if(!url||!/^https:/.test(url)) return url||'';
  try{
    const u=new URL(url);
    if(u.hostname==='ichef.bbci.co.uk'){
      u.pathname=u.pathname.replace(/\/ace\/standard\/\d+\//,'/ace/standard/'+w+'/');
      return u.toString();
    }
    if(u.pathname.includes('/cdn-cgi/image/')){
      u.pathname=u.pathname.replace(/width=(\d+),height=(\d+)/,(m,ww,hh)=>{
        const cw=+ww,ch=+hh,nw=Math.max(cw,Math.min(w,1600));
        return 'width='+nw+',height='+Math.round(ch*(nw/cw));
      });
      return u.toString();
    }
    if(u.pathname.includes('/news/tmb/')){u.pathname=u.pathname.replace('/news/tmb/','/news/800/');return u.toString()}
    if(u.hostname==='i.dawn.com'&&u.pathname.includes('/thumbnail/')){u.pathname=u.pathname.replace('/thumbnail/','/large/');return u.toString()}
    if(u.hostname==='fdn.gsmarena.com'){u.pathname=u.pathname.replace(/\/-\d+x\d+\//,'/-1200x675/');return u.toString()}
    if(u.searchParams.has('width')){
      const cw=+u.searchParams.get('width')||0, ch=+u.searchParams.get('height')||0;
      if(cw&&cw<w){u.searchParams.set('width',String(w)); if(ch) u.searchParams.set('height',String(Math.round(ch*(w/cw))))}
      return u.toString();
    }
    if(u.searchParams.has('w')){
      const cur=+u.searchParams.get('w')||0;
      if(cur&&cur<w) u.searchParams.set('w',String(Math.min(w,1600)));
      return u.toString();
    }
    u.pathname=u.pathname.replace(/\/-\d{2,3}x\d{2,3}\//,'/-1200x675/');
    return u.toString();
  }catch(e){return url}
}
function imgTag(url,kind){
  const hero=kind==='hero';
  const src=hires(url,hero?1600:1280);
  const mid=hires(url,800);
  const sizes=hero?'(min-width:920px) 720px, 100vw':kind==='mini'?'310px':'(min-width:1120px) 420px, (min-width:760px) 50vw, 100vw';
  const set=mid&&mid!==src?` srcset="${esc(mid)} 800w, ${esc(src)} 1600w" sizes="${sizes}"`:'';
  const lazy=hero?'loading="eager" fetchpriority="high"':'loading="lazy"';
  return `<img src="${esc(src)}"${set} alt="" ${lazy} decoding="async" width="1600" height="950" referrerpolicy="no-referrer" onerror="this.parentNode.remove()">`;
}
function renderTicker(){
  const bar=$('tickerBar'),inner=$('tickerInner');

    return `<a class="ticker-item" href="${esc(i.link)}" target="_blank" rel="noopener"><b>${esc(i.source)}</b> ${esc(T)}</a>`;

function attachCardInteractions(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('#list article').forEach(card=>{
    card.addEventListener('pointermove',e=>{
      const r=card.getBoundingClientRect();
      const x=e.clientX-r.left,y=e.clientY-r.top;
      card.style.setProperty('--mx',x+'px');
      card.style.setProperty('--my',y+'px');
      const rx=((y/r.height)-0.5)*-4.5;
      const ry=((x/r.width)-0.5)*4.5;
      card.style.setProperty('--rx',rx.toFixed(2)+'deg');
      card.style.setProperty('--ry',ry.toFixed(2)+'deg');
    });
    card.addEventListener('pointerleave',()=>{
      card.style.setProperty('--rx','0deg');
      card.style.setProperty('--ry','0deg');
    });
  });
}

function render(){
  const nav=$('countries');
  const cs=ORDER.filter(c=>c=="Population"?pop:data.items.some(i=>i.country==c));
  if(!cs.includes(cur))cur="Maldives";
  nav.innerHTML=cs.map(c=>`<button type="button" aria-pressed="${c==cur&&!onlySaved}" data-c="${c}">${esc(tab(c))}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{onlySaved=false;$('savedBtn').setAttribute('aria-pressed','false');cur=b.dataset.c;safeSet('country',cur);render();scrollTo({top:0,behavior:'smooth'})});
  clearInterval(timer);
  if(cur=="Population"&&!onlySaved&&!searchQuery){
    try{return renderPop()}catch(e){console.error(e);pop=POP_FB;return renderPop()}
  }
  let items=onlySaved?data.items.filter(i=>savedLinks.has(i.link)):data.items.filter(i=>i.country==cur);
  if(cur=="Science"&&!onlySaved)items=[...items.filter(i=>i.category=="UK"),...items.filter(i=>i.category!="UK")];
  const hasDv=items.some(isDv);
  if(hasDv&&mvF=='dv')items=items.filter(isDv);
  else if(hasDv&&mvF=='en')items=items.filter(i=>!isDv(i));
  else if(LANG=='dv')items=[...items.filter(isDv),...items.filter(i=>!isDv(i))];
  if(searchQuery){
    items=items.filter(i=>{
      const blob=`${i.title||''} ${i.title_dv||''} ${i.summary||''} ${i.summary_dv||''} ${i.source||''} ${i.category||''}`.toLowerCase();
      return blob.includes(searchQuery);
    });
  }
  const filt=hasDv?`<div class="filt" role="group" aria-label="${esc(t('filter'))}"><span class="meta">${esc(t('filter'))}:</span><button type="button" data-f="all" aria-pressed="${mvF=='all'}">${esc(t('fAll'))}</button><button type="button" data-f="dv" aria-pressed="${mvF=='dv'}">${esc(t('fDv'))}</button><button type="button" data-f="en" aria-pressed="${mvF=='en'}">${esc(t('fEn'))}</button></div>`:'';
  const head=onlySaved?t('saved'):(STR[LANG].tabs[cur]&&["Maldives","World","UK","USA","India","Sri Lanka","Pakistan","UAE","Australia"].includes(cur)?t('tabNews',{c:tab(cur)}):tab(cur));
  const cardTpl=(i,k,idx)=>{
    const isSaved=savedLinks.has(i.link);
    const tr=LANG=='dv'&&i.title_dv;
    const T=tr?i.title_dv:i.title,S=tr?(i.summary_dv||i.summary):i.summary;
    const hasImg=/^https:/.test(i.image||"");
    const extraCls=[k||'',(!S&&k==='hero')?'no-sum':'',(k===''&&idx%5===0)?'bento-wide':''].filter(Boolean).join(' ');
    return `<article class="${extraCls}">${hasImg?`<a class="thumb" href="${esc(i.link)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${k==='mini'?`<span class="rank-badge">0${idx+1}</span>`:''}${imgTag(i.image,k)}</a>`:""}<div class="row">${k==='hero'?`<span class="hero-tag">✦ ${esc(t('featuredStory'))}</span>`:''}<span class="src" dir="auto">${esc(i.source)}</span><span class="meta">${esc(cat(i.category))} · ${ago(i.published)}</span><div class="row-end"><button type="button" class="save-btn" data-save="${esc(i.link)}" aria-pressed="${isSaved}" aria-label="${esc(t('saveStory'))}">★</button></div></div>${tr?`<button type="button" class="trp" data-o="${esc(i.title)}" data-os="${esc(i.summary||'')}" aria-label="${esc(t('showOrig'))}">${esc(t('translated'))} · ${esc(t('showOrig'))}</button>`:''}<h2 dir="auto"><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(T)}</a></h2>${S?`<p dir="auto">${esc(S)}</p>`:''}<div class="card-foot"><a class="read" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(t('readAt',{s:i.source}))}</a></div></article>`;
  };
  $('list').innerHTML=`<div class="sec-bar"><div class="sec-title-wrap"><h2>${esc(head)}</h2><span class="count-pill">${esc(t('storiesCount',{n:items.length}))}</span></div>${filt}</div>`+(items.length?layout(items,cardTpl):`<article class="wide-card"><p>${esc(onlySaved?t('savedEmpty'):t('empty'))}</p></article>`);
  reveal();
  attachCardInteractions();
  function pulse(el){if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap')}
  $('list').querySelectorAll('.trp').forEach(b=>b.onclick=()=>{
    const a=b.closest('article'),h=a.querySelector('h2 a'),p=a.querySelector('p');pulse(a);
    if(!b.dataset.d){b.dataset.d=h.textContent;b.dataset.ds=p?p.textContent:'';h.textContent=b.dataset.o;h.parentNode.dir='ltr';if(p){p.textContent=b.dataset.os;p.dir='ltr'}b.textContent=t('showDv')}
    else{h.textContent=b.dataset.d;h.parentNode.dir='auto';if(p){p.textContent=b.dataset.ds;p.dir='auto'}delete b.dataset.d;b.textContent=t('translated')+' · '+t('showOrig')}
  });
  $('list').querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{
    const url=b.dataset.save;
    if(savedLinks.has(url))savedLinks.delete(url);else savedLinks.add(url);
    persistSaved();
    b.setAttribute('aria-pressed',savedLinks.has(url));
    if(onlySaved)render();
  });
  $('list').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{mvF=b.dataset.f;safeSet('mvF',mvF);render()});
  const prevBtn=$('cPrev'),nextBtn=$('cNext'),trow=$('trowEl');
  if(prevBtn&&nextBtn&&trow){
    prevBtn.onclick=()=>trow.scrollBy({left:LANG=='dv'?320:-320,behavior:'smooth'});
    nextBtn.onclick=()=>trow.scrollBy({left:LANG=='dv'?-320:320,behavior:'smooth'});
  }
  if(window.renderDock)renderDock();
}

function layout(it,f){
  if(it.length<4||streamMode)return it.map((i,idx)=>f(i,'',idx)).join('');
  const dv=LANG=='dv';
  const top=it.slice(1,9),rest=it.slice(9);
  return f(it[0],'hero',0)+`<section class="tops"><div class="tops-head"><h3>${dv?'މުހިންމު ޚަބަރުތައް':'Top stories'}</h3><div class="carousel-nav"><button type="button" id="cPrev" aria-label="Previous">‹</button><button type="button" id="cNext" aria-label="Next">›</button></div></div><div class="trow" id="trowEl">${top.map((i,idx)=>f(i,'mini',idx)).join('')}</div></section>`+(rest.length?`<h3 class="more">${dv?'އިތުރު ޚަބަރުތައް':'More stories'}</h3>`+rest.map((i,idx)=>f(i,'',idx)).join(''):'');
}

function reveal(){
  const els=[...document.querySelectorAll('#list article:not(.hero)')];
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const io=new IntersectionObserver(es=>{
    let n=0;
    es.forEach(e=>{if(e.isIntersecting){e.target.style.transitionDelay=(n++%6)*55+'ms';e.target.classList.add('in');io.unobserve(e.target)}});
  },{rootMargin:'0px 0px -4% 0px'});
  els.forEach(e=>{e.classList.add('rv');io.observe(e)});
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');

  }
});

const POP_FB={source:"World Bank Open Data (UN World Population Prospects) - built-in estimate",source_url:"https://data.worldbank.org/indicator/SP.POP.TOTL",world:{pop:{value:8215424893,year:2025},growth:{value:0.91,year:2025},birth_rate:{value:16.3,year:2024},death_rate:{value:7.6,year:2024},life_exp:{value:73.5,year:2024},urban_pct:{value:57.8,year:2024}},maldives:{pop:{value:529676,year:2025},growth:{value:0.35,year:2025}},top:[["India", 1463865525], ["China", 1406585000], ["United States", 341784857], ["Indonesia", 285721236], ["Pakistan", 255219554], ["Nigeria", 237527782], ["Brazil", 212812405], ["Bangladesh", 175686899], ["Russian Federation", 143513328], ["Ethiopia", 135472051]].map(([name,pop])=>({name,pop,year:2025}))};
function fixPop(p){
  p=p||{};const w=Object.assign({},POP_FB.world,p.world||{}),r={...POP_FB,...p,world:w};
  for(const k in POP_FB.world)if(!w[k]||typeof w[k].value!="number")w[k]=POP_FB.world[k];
  if(!r.maldives||!r.maldives.pop||!r.maldives.growth)r.maldives=POP_FB.maldives;
  if(!Array.isArray(r.top)||r.top.length<5)r.top=POP_FB.top;
  return r;
}
pop=POP_FB;
const nf=n=>Math.round(n).toLocaleString('en-US');

function renderPop(){
  const w=pop.world,b=w.pop.value,y0=Date.UTC(w.pop.year,6,1),yr=365.25*864e5,g=Math.log(1+w.growth.value/100);
  const now=new Date(),ys=Date.UTC(now.getUTCFullYear(),0,1);
  const cards=[["popLive","pop","🌍"],["popBirths","b","🌱"],["popDeaths","d","🕯️"],["popGrowth","n","📈"]];
  const src=`${esc(t('source'))} <a href="${pop.source_url}" target="_blank" rel="noopener">${esc(pop.source)}</a>`;
  const maxTop=Math.max(...pop.top.map(x=>x.pop));
  $('list').innerHTML=
    `<div class="sec-bar"><div class="sec-title-wrap"><h2>${esc(t('popTitle'))}</h2><span class="live-pill"><span class="live-dot"></span>Live Counter</span></div></div>`+
    `<p class="meta">${t('popNote',{y:w.pop.year,b:nf(b),gy:w.growth.year,g:w.growth.value.toFixed(2),br:w.birth_rate.value.toFixed(1),dr:w.death_rate.value.toFixed(1)})} ${src}</p>`+
    cards.map(([k1,k,ic])=>`<article class="pop-stat-card"><div class="row"><span class="pop-stat-icon" aria-hidden="true">${ic}</span><span class="meta">${esc(t(k1))}</span></div><h2 id="pc-${k}" dir="ltr" style="margin:6px 0;text-align:start">…</h2></article>`).join('')+
    `<article class="side-card"><div class="row"><span class="pop-stat-icon" aria-hidden="true">🇲🇻</span><span class="meta">${esc(t('mvPop',{y:pop.maldives.pop.year}))}</span></div><h2 style="font-size:1.85em;margin:6px 0;color:var(--teal)">${nf(pop.maldives.pop.value)}</h2><p>${esc(t('mvGrowth',{g:pop.maldives.growth.value.toFixed(2),y:pop.maldives.growth.year}))} ${src}</p><div class="gauge-row"><div class="gauge-box"><span class="gauge-val">${w.life_exp.value.toFixed(1)}</span><span class="meta">${esc(t('life'))} (${esc(t('years'))})</span></div><div class="gauge-box"><span class="gauge-val">${w.urban_pct.value.toFixed(1)}%</span><span class="meta">${esc(t('urban'))}</span></div></div></article>`+
    `<article class="wide-card"><span class="meta">${esc(t('top',{y:pop.top[0].year}))}</span><ol class="country-bar-list">${pop.top.map((x,idx)=>`<li class="country-bar-item"><div class="country-bar-top"><span><strong>#${idx+1} ${esc(x.name)}</strong></span><strong dir="ltr">${nf(x.pop)}</strong></div><div class="country-bar-track"><div class="country-bar-fill" style="--w:${Math.max(8,Math.round(x.pop/maxTop*100))}%"></div></div></li>`).join('')}</ol><p class="meta">${src}</p></article>`;
  const tick=()=>{
    const T=Date.now(),P=b*Math.exp(g*(T-y0)/yr),Ps=b*Math.exp(g*(ys-y0)/yr),f=(T-ys)/yr;
    const B=P*w.birth_rate.value/1000*f,D=P*w.death_rate.value/1000*f;
    for(const[k,v]of[["pop",P],["b",B],["d",D],["n",P-Ps]]){const e=$('pc-'+k);if(e)e.textContent=nf(v)}
  };
  tick();timer=setInterval(tick,1000);
  attachCardInteractions();
  if(window.renderDock)renderDock();
}

function showLoadFail(){
  if($('tickerBar')) $('tickerBar').style.display='none';
  $('list').innerHTML=`<article class="wide-card load-fail"><p>${esc(t('loadFail'))}</p><button type="button" id="retryNews">${esc(t('retry'))}</button></article>`;
  const b=$('retryNews'); if(b) b.onclick=loadNews;
}
function loadNews(){
  $('list').innerHTML=`<p class="vh">${esc(t('loading'))}</p>`;
  fetch('data/news.json?'+Date.now()).then(r=>{if(!r.ok) throw new Error(String(r.status)); return r.json()}).then(d=>{
    if(!d||!Array.isArray(d.items)||!d.items.length) throw new Error('empty');
    data=d; applyAll();
  }).catch(()=>{data=null; showLoadFail()});
}
fetch('data/population.json?'+Date.now()).then(r=>r.json()).then(p=>{pop=fixPop(p);if(data)render()}).catch(()=>{});
loadNews();
</script><script src="dock.js"></script></body></html>
