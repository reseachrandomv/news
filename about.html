<style>
:root{--fs:19px;--scale:1;--bg:#1e2633;--card:#232c3b;--ink:#eef2f8;--muted:#b4bfd0;--blue:#9cc8ff;--blue2:#2a3446;--head:#1e2633;--btnbg:#232c3b;--on:#14202f;--hi:#2a3546;--lo:#131923;color-scheme:dark}

:root{--up:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);--upsm:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);--in:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
*{box-sizing:border-box}html{font-size:calc(var(--fs) * var(--scale))}
button,.cta{font:inherit;cursor:pointer;border-radius:999px;border:0;min-height:44px;padding:6px 18px;background:var(--btnbg);color:var(--blue);font-weight:600;box-shadow:var(--upsm);transition:box-shadow .2s,transform .1s,color .2s;text-decoration:none}
button:hover{box-shadow:var(--up)}button:active,button[aria-pressed=true]{box-shadow:var(--in);transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default;box-shadow:none}button:focus-visible,a:focus-visible{outline:3px solid #f5b400;outline-offset:3px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 1rem/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.top{max-width:1000px;margin:auto;padding:14px 16px;display:flex;justify-content:flex-end;gap:10px}
.cta{display:inline-flex;align-items:center;background:var(--blue);color:var(--on);font-size:1.15em;padding:12px 30px;box-shadow:var(--up)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:18px;margin:2em 0;text-align:start}

.contact{background:var(--card);border-radius:22px;padding:16px 20px;display:inline-block;box-shadow:var(--in)}.contact a{color:var(--blue);font-weight:700}

 intro:"އައްސަލާމު ޢަލައިކުމް! އަހަރެންނަކީ ދިވެހިރާއްޖެއިން ފާތިމަތު މަލާކް ޖައުފަރު. މިއީ އަހަރެންގެ ޚަބަރު ސައިޓް.",
 why:"މި ސައިޓް ހެދީ ދިވެހިރާއްޖޭގެ ލޯކަލް ޚަބަރުތަކާއި ދުނިޔޭގެ ޚަބަރު، ޓެކް، ސައިންސް، ކޯސްތަކާއި އިޢުލާންތައް، ފަސޭހަ އަދި ހިލޭ އެއް ތަނަކުން ލިބޭނެ ގޮތަށް. ކޮންމެ 30 މިނިޓަކުން ޚަބަރުތައް އަމިއްލައަށް އާވޭ.",
 features:[["⏱️","30 މިނިޓުން އަޕްޑޭޓް","ކޮންމެ 30 މިނިޓަކުން އާ ސުރުޚީތައް އަމިއްލައަށް ލިބޭ."],["🏝️","120 އަށްވުރެ ގިނަ ދިވެހި ޚަބަރު","ގިނަ ދިވެހި ނޫސްތަކުގެ ޚަބަރު އެއް ޓެބަކުން."],["🌍","ދުނިޔޭގެ އާބާދީ","ދުނިޔޭގެ އާބާދީ، އުފަންވުމާއި މަރުވުމުގެ ލައިވް އަންދާޒާ."],["📱","ޓެކް އަދި ގެޖެޓްސް","ފޯނު، އިލެކްޓްރޯނިކްސް އަދި އާ ޓެކްނޮލޮޖީ."],["🎓","ކޯސްތަކާއި އިޢުލާންތައް","ކޯސް، އެޑްމިޝަން އަދި ކޮލެޖާއި ސްކޫލުތަކުގެ ޚަބަރު."],["🔬","ސައިންސާއި ހޯދުންތައް","އާ ހޯދުންތައް، ޔޫކޭގެ ކާމިޔާބީތައް ފުރަތަމަ."],["🌗","ޑާކް އަދި ލައިޓް މޯޑް","ލޮލަށް ފަސޭހަ ކުލަ ހޮވާ."],["🔠","އަކުރުގެ ސައިޒު","އަކުރު ކުޑަކޮށް ނުވަތަ ބޮޑުކޮށްލާ."],["🗣️","English އަދި ދިވެހި","ސައިޓް އިނގިރޭސިން ނުވަތަ ދިވެހިން ބޭނުންކުރޭ."]]});
const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const TABLINK={"🏝️":"Maldives","🌍":"Population","📱":"Tech","🎓":"Courses","🔬":"Science"};
function draw(){setLangAttrs();document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.title=t('site');
 const o=Object.keys(LANGS).find(l=>l!=LANG);$('lg').textContent=LANGS[o].label;$('lg').lang=o;$('lg').setAttribute('aria-label',t('langAria'));
 $('grid').innerHTML=(STR[LANG].features).map(([i,h,p])=>{const tb=TABLINK[i];const inner=`<span class="ic" aria-hidden="true">${i}</span><b>${esc(h)}</b>${esc(p)}`;return tb?`<a class="card" style="color:inherit;text-decoration:none;display:block" href="./?tab=${tb}" onclick="localStorage.introSeen='1';localStorage.country='${tb}'">${inner}</a>`:`<div class="card">${inner}</div>`}).join('')}
