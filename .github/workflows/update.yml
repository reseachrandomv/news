name: Update news
on:
  schedule: [{cron: "7,37 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/fetch_news.py
      - run: python scripts/translate_dv.py || echo "translation failed, English fallback"
      - run: python scripts/fetch_population.py || echo "population fetch failed, keeping old file"
      - run: |
          git config user.name "Fathimath Malaak Jaufar"
          git config user.email "reseachrandomv@users.noreply.github.com"
          git add data/news.json data/population.json data/translations.json
          git diff --cached --quiet || (git commit -m "Update news $(date -u +%FT%H:%MZ)" && git push)
